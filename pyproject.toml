[project]
name = "sop-guided-conversational-agent"
version = "0.1.0"
description = "SOP-guided conversational agent"
authors = [
    {name = "Bharath26214",email = "bharathtoutireddy15@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain (>=1.4.0,<2.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "streamlit (>=1.63.0,<2.0.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "logfire[httpx,sqlite3] (>=4.41.0,<5.0.0)",
    "nemoguardrails (>=0.24.0,<0.25.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
